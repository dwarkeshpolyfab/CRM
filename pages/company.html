<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Contact Details — Dwarkesh CRM</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <meta name="theme-color" content="#112a46" />
</head>
<body>

  <!-- Header -->
  <div class="app-header">
    <a href="javascript:history.back()" class="back-btn" title="Back">‹</a>
    <img src="../assets/logo.png" alt="Logo" class="brand-logo sm" />
    <div class="brand-info">
      <h1 class="brand-title" id="page-title">CONTACT DETAILS</h1>
      <div class="brand-tagline">Dwarkesh Polyfab CRM</div>
    </div>
  </div>

  <div class="container">
    <div id="company-view"></div>
    <div id="company-edit" class="hidden"></div>
    <div id="reminder-section"></div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="../assets/app.js"></script>

  <script>
    let currentId = null;
    let editMode = false;
    let isFromNewArrival = false;

    function getIdFromUrl() {
      const p = new URLSearchParams(window.location.search);
      return p.get('id');
    }

    function checkSource() {
      const p = new URLSearchParams(window.location.search);
      isFromNewArrival = (p.get('autoEdit') === '1' || p.get('from') === 'new_arrival' || document.referrer.includes('new_arrival'));
    }

    function cleanNoteText(note) {
      if (!note) return '';
      if (note.includes('Auto-imported from Google')) return '';
      return note.trim();
    }

    function renderView(c) {
      if (!c) {
        document.getElementById('company-view').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <p>Contact not found</p>
          </div>`;
        return;
      }

      document.getElementById('page-title').textContent = c.name || 'Contact Details';

      const isNew = (c.segment === 'new_arrival');
      const products = (c.products || []).map(p => `<span class="tag">${getProductLabel(p)}</span>`).join(' ');
      const otherProd = c.otherProduct ? `<span class="tag tag-other">${escHtml(c.otherProduct)}</span>` : '';

      const placeDisplay = c.state === 'Export'
        ? ('✈️ Export (' + (c.country || 'International') + ')')
        : (c.state ? ('📍 ' + c.state + (c.city ? ', ' + c.city : '')) : (c.city ? '📍 ' + c.city : 'Not set'));

      const cleanNote = cleanNoteText(c.companyNotes);

      document.getElementById('company-view').innerHTML = `
        ${isNew ? `
        <div class="alert-box-new-arrival fade-in">
          <div class="ab-title">🆕 New Arrival from Gmail</div>
          <p class="ab-text">This contact has not been categorized yet. Set Star Rating ⭐, Place 📍 & Products 📦 to organize it.</p>
          <button class="btn btn-primary btn-block btn-lg" onclick="toggleEdit(true)">⚡ Categorize & Segment Contact Now</button>
        </div>` : ''}

        <div class="detail-header-card fade-in">
          <div class="dh-top">
            <h2 class="dh-name">${escHtml(c.name)}</h2>
            <div class="dh-rating">${getRatingStars(c.rating)}</div>
          </div>
          <div class="dh-phone">📞 ${escHtml(c.phone || 'No phone')}</div>
          <div class="dh-place">${escHtml(placeDisplay)}</div>

          <!-- Quick Action Buttons -->
          <div class="action-row" style="margin-top:16px;">
            <button class="btn btn-green btn-lg flex-1" onclick="openWhatsApp('${escAttr(c.phone)}')">
              💬 WhatsApp
            </button>
            <button class="btn btn-primary btn-lg flex-1" onclick="callPhone('${escAttr(c.phone)}')">
              📞 Call
            </button>
          </div>
        </div>

        <!-- Products Section -->
        <div class="detail-section fade-in">
          <h3>📦 Product Requirements</h3>
          <div class="cc-tags" style="margin-top:8px;">
            ${(products || otherProd) ? (products + ' ' + otherProd) : '<span style="color:var(--text-muted);font-size:0.85rem;">No products specified yet</span>'}
          </div>
        </div>

        <!-- Notes / Inquiry Details (Auto-imported text removed) -->
        ${cleanNote ? `
        <div class="detail-section fade-in">
          <h3>📝 Inquiry Notes</h3>
          <p class="notes-content">${escHtml(cleanNote)}</p>
        </div>` : ''}

        <!-- Edit & Delete Buttons -->
        <div class="action-row" style="margin-top:16px;">
          <button class="btn btn-outline flex-1" onclick="toggleEdit(true)">✏️ Edit / Categorize</button>
          <button class="btn btn-red flex-1" onclick="handleDelete()">🗑️ Delete</button>
        </div>
      `;
    }

    function toggleEdit(forceOpen) {
      if (forceOpen !== undefined) editMode = forceOpen;
      else editMode = !editMode;

      if (editMode) {
        renderEditForm();
        document.getElementById('company-view').classList.add('hidden');
        document.getElementById('company-edit').classList.remove('hidden');
      } else {
        document.getElementById('company-view').classList.remove('hidden');
        document.getElementById('company-edit').classList.add('hidden');
      }
    }

    function renderEditForm() {
      const c = getCompany(currentId);
      if (!c) return;

      const ratingRadios = RATING_OPTIONS.map(r => `
        <label class="rating-radio-card sm">
          <input type="radio" name="e-rating" value="${r.value}" ${c.rating === r.value ? 'checked' : ''} />
          <div class="r-body">
            <span class="r-stars">${r.stars}</span>
            <span class="r-label">${r.label}</span>
          </div>
        </label>
      `).join('');

      const productChecks = PRODUCT_OPTIONS.map(p => `
        <label class="product-check-label">
          <input type="checkbox" name="e-products" value="${p.value}" ${(c.products||[]).includes(p.value) ? 'checked' : ''} onchange="toggleEditOther(this)" />
          <span>${p.label}</span>
        </label>
      `).join('');

      const isExport = (c.state || '').toLowerCase() === 'export';
      const cleanNote = cleanNoteText(c.companyNotes);

      document.getElementById('company-edit').innerHTML = `
        <form onsubmit="return handleSaveEdit(event)" class="fade-in">
          <div class="form-card">
            <h3>⚡ Segment & Classify Contact</h3>
            <div class="form-group" style="margin-top:12px;">
              <label>Name <span class="required">*</span></label>
              <input type="text" class="form-control" id="e-name" value="${escHtml(c.name)}" required />
            </div>

            <div class="form-group">
              <label>Phone <span class="required">*</span></label>
              <input type="tel" class="form-control" id="e-phone" value="${escHtml(c.phone)}" required />
            </div>
          </div>

          <div class="form-card">
            <div class="form-group">
              <label>Place <span class="required">*</span> <small style="color:var(--text-muted);">(Type "Gu" for Gujarat, "India", or "Export")</small></label>
              <input type="text" class="form-control" id="e-place" list="edit-place-list" value="${escHtml(c.state || '')}" placeholder="Type place (Gujarat, Maharashtra, India, Export...)" required oninput="handleEditPlaceChange(this.value)" />
              <datalist id="edit-place-list"></datalist>
            </div>

            <div class="form-group ${isExport ? '' : 'hidden'}" id="e-group-country">
              <label>Export Country Name <span class="required">*</span></label>
              <input type="text" class="form-control" id="e-country" value="${escHtml(c.country || '')}" placeholder="e.g. USA, UAE, Kenya..." />
            </div>

            <div class="form-group">
              <label>City <small style="color:var(--text-muted);">(Optional)</small></label>
              <input type="text" class="form-control" id="e-city" value="${escHtml(c.city || '')}" placeholder="City..." />
            </div>
          </div>

          <div class="form-card">
            <label style="font-weight:800;color:var(--gold-light);margin-bottom:8px;display:block;">
              Rating Priority <span class="required">*</span>
            </label>
            <div class="rating-picker">
              ${ratingRadios}
            </div>
          </div>

          <div class="form-card">
            <label style="font-weight:800;color:var(--gold-light);margin-bottom:8px;display:block;">
              Product Requirements
            </label>
            <div class="product-grid">${productChecks}</div>

            <div class="form-group ${(c.products||[]).includes('other') ? '' : 'hidden'}" id="e-group-other" style="margin-top:10px;">
              <label>Other Product Requirement Details:</label>
              <input type="text" class="form-control" id="e-other-product" value="${escHtml(c.otherProduct || '')}" placeholder="Describe specific bag..." />
            </div>
          </div>

          <div class="form-card">
            <div class="form-group">
              <label>Inquiry Notes <small style="color:var(--text-muted);">(Optional)</small></label>
              <textarea class="form-control" id="e-notes" rows="3" placeholder="Add specific inquiry notes here...">${escHtml(cleanNote)}</textarea>
            </div>
          </div>

          <!-- 🌟 BIG PROMINENT SAVE BUTTON 🌟 -->
          <div style="margin-bottom: 30px;">
            <button type="submit" class="btn-save-prominent" id="btn-save-edit">
              💾 Save Changes
            </button>
            <button type="button" class="btn btn-outline btn-block" style="margin-top:10px;height:44px;" onclick="toggleEdit(false)">Cancel</button>
          </div>
        </form>
      `;

      renderPlaceDatalist('edit-place-list');
    }

    function handleEditPlaceChange(val) {
      const isExport = val.trim().toLowerCase() === 'export';
      const grp = document.getElementById('e-group-country');
      const inpCountry = document.getElementById('e-country');
      if (grp && inpCountry) {
        if (isExport) {
          grp.classList.remove('hidden');
          inpCountry.required = true;
        } else {
          grp.classList.add('hidden');
          inpCountry.required = false;
        }
      }
    }

    function toggleEditOther(el) {
      if (el.value === 'other') {
        const grp = document.getElementById('e-group-other');
        if (grp) grp.classList.toggle('hidden', !el.checked);
      }
    }

    function handleSaveEdit(e) {
      e.preventDefault();
      const c = getCompany(currentId);
      if (!c) return false;

      const wasNewArrival = (c.segment === 'new_arrival' || isFromNewArrival);

      c.name = document.getElementById('e-name').value.trim();
      c.phone = document.getElementById('e-phone').value.trim();
      c.state = document.getElementById('e-place').value.trim();
      c.country = (c.state.toLowerCase() === 'export') ? document.getElementById('e-country').value.trim() : '';
      c.city = document.getElementById('e-city').value.trim();
      c.companyNotes = document.getElementById('e-notes').value.trim();

      const otherEl = document.getElementById('e-other-product');
      c.otherProduct = otherEl ? otherEl.value.trim() : '';

      const ratingEl = document.querySelector('input[name="e-rating"]:checked');
      if (ratingEl) {
        c.rating = ratingEl.value;
      }

      c.products = Array.from(document.querySelectorAll('input[name="e-products"]:checked')).map(el => el.value);

      // Categorized! Removes from New Arrivals
      c.segment = 'categorized';

      const saveBtn = document.getElementById('btn-save-edit');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';
      }

      saveCompany(c).then(() => {
        // User Requirement: "WHEN I SAVED THIS DETAIL FROM NEW ARRIVEL THEN BACK THE PAGE OF NEW ARRIVEL PAGE DO IT"
        if (wasNewArrival) {
          showToast('✅ Saved! Returning to New Arrivals...');
          setTimeout(() => {
            window.location.href = 'data.html?view=new_arrival';
          }, 400);
        } else {
          showToast('✅ Contact Details Updated!');
          editMode = false;
          document.getElementById('company-view').classList.remove('hidden');
          document.getElementById('company-edit').classList.add('hidden');
          renderView(c);
          renderReminders(c);
        }
      });

      return false;
    }

    function handleDelete() {
      const c = getCompany(currentId);
      confirmDelete(currentId, c ? c.name : '');
      setTimeout(() => {
        const btn = document.getElementById('delete-modal-confirm');
        if (btn) {
          btn.onclick = async () => {
            await deleteCompany(currentId);
            closeDeleteModal();
            showToast('Contact deleted');
            setTimeout(() => {
              if (isFromNewArrival) window.location.href = 'data.html?view=new_arrival';
              else window.location.href = 'data.html';
            }, 300);
          };
        }
      }, 50);
    }

    // ── Reminders Section ──
    function renderReminders(c) {
      if (!c) return;
      const reminders = getRemindersForCompany(c.id);
      const active = reminders.filter(r => !r.completed).sort((a,b) => (a.date||'').localeCompare(b.date||''));
      const completed = reminders.filter(r => r.completed);

      let html = `
        <div class="detail-section fade-in" style="margin-top:16px;">
          <h3>⏰ Reminders & Follow-ups</h3>
          <form onsubmit="return addReminder(event)" style="margin-top:10px;margin-bottom:14px;">
            <div style="display:flex;gap:8px;">
              <input type="date" class="form-control" id="r-date" required style="flex:1;" />
              <input type="text" class="form-control" id="r-note" placeholder="Reminder note (e.g. Call for rate)..." style="flex:2;" />
            </div>
            <button type="submit" class="btn btn-primary btn-sm" style="margin-top:8px;">➕ Set Reminder</button>
          </form>`;

      if (active.length === 0 && completed.length === 0) {
        html += `<p style="color:var(--text-muted);font-size:0.85rem;">No reminders active</p>`;
      }

      active.forEach(r => {
        const isPast = (r.date < getTodayDateStr());
        html += `
          <div class="reminder-item-box ${isPast ? 'missed-box' : ''}">
            <div class="rib-top">
              <span class="rib-note">${escHtml(r.note || 'Follow-up')}</span>
              <span class="rib-date">${isPast ? '⚠️ Missed: ' : '📅 '} ${r.date}</span>
            </div>
            <div class="rib-actions">
              <button class="btn btn-green btn-sm" onclick="completeReminder('${r.id}').then(()=>{showToast('Reminder Done!'); renderReminders(getCompany(currentId));})">
                ✅ Done / Updated
              </button>
              <button class="btn btn-red btn-sm" onclick="deleteReminder('${r.id}').then(()=>{showToast('Reminder deleted'); renderReminders(getCompany(currentId));})">
                🗑️
              </button>
            </div>
          </div>`;
      });

      if (completed.length > 0) {
        html += `<div style="margin-top:12px;color:var(--text-muted);font-size:0.8rem;font-weight:700;">Completed (${completed.length})</div>`;
        completed.forEach(r => {
          html += `<div class="reminder-item-box completed">
            <span style="text-decoration:line-through;color:var(--text-muted);">${escHtml(r.note || 'Reminder')}</span>
            <span style="color:var(--text-muted);font-size:0.75rem;">Completed</span>
          </div>`;
        });
      }

      html += `</div>`;
      document.getElementById('reminder-section').innerHTML = html;
    }

    function addReminder(e) {
      e.preventDefault();
      const date = document.getElementById('r-date').value;
      const note = document.getElementById('r-note').value.trim();
      if (!date) return false;

      const c = getCompany(currentId);
      saveReminder({
        id: genId(),
        companyId: currentId,
        companyName: c ? c.name : '',
        companyPhone: c ? c.phone : '',
        date,
        note,
        completed: false
      }).then(() => {
        showToast('Reminder Added!');
        document.getElementById('r-date').value = '';
        document.getElementById('r-note').value = '';
        renderReminders(c);
      });
      return false;
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderBottomNav('data');
      currentId = getIdFromUrl();
      checkSource();

      if (!currentId) {
        document.getElementById('company-view').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <p>No contact ID provided</p>
          </div>`;
        return;
      }

      onDataChange(() => {
        const c = getCompany(currentId);
        if (!editMode) renderView(c);
        renderReminders(c);
      });

      setTimeout(() => {
        const c = getCompany(currentId);
        if (c) {
          if (isFromNewArrival || c.segment === 'new_arrival') {
            toggleEdit(true);
          } else {
            renderView(c);
          }
          renderReminders(c);
        } else {
          renderView(null);
        }
      }, 400);
    });
  </script>
</body>
</html>
