<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Company — Dwarkesh CRM</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <meta name="theme-color" content="#0f172a" />
</head>
<body>

  <!-- Header -->
  <div class="app-header">
    <img src="../assets/log✅png" alt="Logo" class="logo" />
    <div>
      <h1 id="page-title">Company Details</h1>
      <div class="subtitle">Dwarkesh Polyfab CRM</div>
    </div>
  </div>

  <div class="container">
    <div id="company-view"></div>
    <div id="company-edit" class="hidden"></div>
    <div id="reminder-section"></div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="../assets/app.js"></script>

  <script>
    let currentId = null;
    let editMode = false;

    function getIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    function renderView(c) {
      if (!c) {
        document.getElementById('company-view').innerHTML = `
        ${(!c.rating || c.rating === 'not_set' || c.segment === 'new_arrival') ? `
        <div class="card" style="background: rgba(245, 158, 11, 0.15); border: 1px solid var(--orange); margin-bottom: 16px; padding: 14px; border-radius: 10px;">
          <div style="font-weight: 700; color: var(--orange); font-size: 1rem; margin-bottom: 4px;">🆕 New Arrival — Details Needed</div>
          <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 10px;">This contact was saved from Gmail. Set their Star Rating ⭐, State 📍, and Products 📦 to organize your CRM.</p>
          <button class="btn btn-primary" onclick="toggleEdit()" style="width: 100%; font-weight: 700;">⚡ Set Rating, State & Products Now</button>
        </div>` : ''}

          <div class="empty-state">
            <div class="empty-icon">❌</div>
            <p>Company not found</p>
          </div>`;
        return;
      }

      document.getElementById('page-title').textContent = c.name || 'Company';

      const products = (c.products || []).map(p => `<span class="tag">${getProductLabel(p)}</span>`).join(' ');
      const otherProd = c.otherProduct ? `<span class="tag" style="background:var(--orange-bg);color:var(--orange);">${escHtml(c.otherProduct)}</span>` : '';

      document.getElementById('company-view').innerHTML = `
        <div class="detail-header">
          <h2>${escHtml(c.name)}</h2>
          <div class="detail-phone">${escHtml(c.phone)}</div>
          <div style="margin-top:8px">${getRatingStars(c.rating)}</div>
        </div>

        <!-- Quick Actions -->
        <div class="fab-actions">
          <button class="btn btn-green" onclick="openWhatsApp('${escAttr(c.phone)}')">📱 WhatsApp</button>
          <button class="btn btn-primary" onclick="callPhone('${escAttr(c.phone)}')">📞 Call</button>
        </div>

        <!-- Details -->
        <div class="detail-section">
          <h3>Company Info</h3>
          <div class="detail-row">
            <span class="dr-label">State</span>
            <span class="dr-value">${escHtml(c.state || '—')}</span>
          </div>
          <div class="detail-row">
            <span class="dr-label">City</span>
            <span class="dr-value">${escHtml(c.city || '—')}</span>
          </div>
          <div class="detail-row">
            <span class="dr-label">Nature</span>
            <span class="dr-value">${escHtml(c.nature || '—')}</span>
          </div>
          <div class="detail-row">
            <span class="dr-label">Status</span>
            <span class="dr-value">${buildStatusBadge(c.status)}</span>
          </div>
          <div class="detail-row">
            <span class="dr-label">Segment</span>
            <span class="dr-value">${escHtml(c.segment || '—')}</span>
          </div>
          <div class="detail-row">
            <span class="dr-label">Source</span>
            <span class="dr-value">${escHtml(c.source || '—')}</span>
          </div>
        </div>

        <div class="detail-section">
          <h3>Products</h3>
          <div class="cc-tags">${products} ${otherProd}</div>
        </div>

        ${c.companyNotes ? `
        <div class="detail-section">
          <h3>Notes</h3>
          <p style="color:var(--text-secondary);font-size:0.9rem;white-space:pre-wrap;">${escHtml(c.companyNotes)}</p>
        </div>` : ''}

        <!-- Edit / Delete -->
        <div class="action-row" style="margin-top:16px;">
          <button class="btn btn-primary" style="flex:1" onclick="toggleEdit()">✏️ Edit</button>
          <button class="btn btn-red" style="flex:1" onclick="handleDelete()">🗑️ Delete</button>
        </div>
      `;
    }

    function toggleEdit() {
      editMode = !editMode;
      if (editMode) {
        renderEditForm();
        document.getElementById('company-view').classList.add('hidden');
        document.getElementById('company-edit').classList.remove('hidden');
      } else {
        document.getElementById('company-view').classList.remove('hidden');
        document.getElementById('company-edit').classList.add('hidden');
      }
    }

    function renderEditForm() {
      const c = getCompany(currentId);
      if (!c) return;

      const ratingRadios = RATING_OPTIONS.map(r =>
        `<label><input type="radio" name="e-rating" value="${r.value}" ${c.rating === r.value ? 'checked' : ''} /> ${r.label}</label>`
      ).join('');

      const productChecks = PRODUCT_OPTIONS.map(p =>
        `<label><input type="checkbox" name="e-products" value="${p.value}" ${(c.products||[]).includes(p.value) ? 'checked' : ''} /> ${p.label}</label>`
      ).join('');

      const statusOpts = STATUS_OPTIONS.map(s =>
        `<option value="${s}" ${c.status === s ? 'selected' : ''}>${s}</option>`
      ).join('');

      const segmentOpts = SEGMENT_OPTIONS.map(s =>
        `<option value="${s.value}" ${c.segment === s.value ? 'selected' : ''}>${s.label}</option>`
      ).join('');

      const natureOpts = ['','Manufacturer','Trader','Exporter'].map(n =>
        `<option value="${n}" ${c.nature === n ? 'selected' : ''}>${n || 'Select Nature'}</option>`
      ).join('');

      document.getElementById('company-edit').innerHTML = `
        <form onsubmit="return handleSaveEdit(event)">
          <div class="form-group">
            <label>Name <span class="required">*</span></label>
            <input type="text" class="form-control" id="e-name" value="${escHtml(c.name)}" required />
          </div>
          <div class="form-group">
            <label>Phone <span class="required">*</span></label>
            <input type="tel" class="form-control" id="e-phone" value="${escHtml(c.phone)}" required />
          </div>
          <div class="form-group">
            <label>State</label>
            <select class="form-control" id="e-state"></select>
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" class="form-control" id="e-city" value="${escHtml(c.city || '')}" />
          </div>
          <div class="form-group">
            <label>Nature</label>
            <select class="form-control" id="e-nature">${natureOpts}</select>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select class="form-control" id="e-status">${statusOpts}</select>
          </div>
          <div class="form-group">
            <label>Segment</label>
            <select class="form-control" id="e-segment">${segmentOpts}</select>
          </div>
          <div class="form-group">
            <label>Rating</label>
            <div class="radio-group">${ratingRadios}</div>
          </div>
          <div class="form-group">
            <label>Products</label>
            <div class="checkbox-group">${productChecks}</div>
            <div style="margin-top:10px;">
              <input type="text" class="form-control" id="e-other-product" value="${escHtml(c.otherProduct || '')}" placeholder="Other product (if selected)" />
            </div>
          </div>
          <div class="form-group">
            <label>Notes</label>
            <textarea class="form-control" id="e-notes">${escHtml(c.companyNotes || '')}</textarea>
          </div>
          <div class="action-row">
            <button type="submit" class="btn btn-green" style="flex:1">💾 Save</button>
            <button type="button" class="btn btn-outline" style="flex:1" onclick="toggleEdit()">Cancel</button>
          </div>
        </form>
      `;

      populateStateDropdown(document.getElementById('e-state'), c.state || '');
    }

    function handleSaveEdit(e) {
      e.preventDefault();
      const c = getCompany(currentId);
      if (!c) return false;

      c.name = document.getElementById('e-name').value.trim();
      c.phone = document.getElementById('e-phone').value.trim();
      c.state = document.getElementById('e-state').value;
      c.city = document.getElementById('e-city').value.trim();
      c.nature = document.getElementById('e-nature').value;
      c.status = document.getElementById('e-status').value;
      c.segment = document.getElementById('e-segment').value;
      c.companyNotes = document.getElementById('e-notes').value.trim();
      c.otherProduct = document.getElementById('e-other-product').value.trim();

      const ratingEl = document.querySelector('input[name="e-rating"]:checked');
      if (ratingEl) c.rating = ratingEl.value;

      c.products = Array.from(document.querySelectorAll('input[name="e-products"]:checked')).map(el => el.value);

      saveCompany(c).then(() => {
        showToast('Company updated');
        editMode = false;
        document.getElementById('company-view').classList.remove('hidden');
        document.getElementById('company-edit').classList.add('hidden');
        renderView(c);
        renderReminders(c);
      });

      return false;
    }

    function handleDelete() {
      const c = getCompany(currentId);
      confirmDelete(currentId, c ? c.name : '');
      // Override the confirm button to also redirect
      setTimeout(() => {
        const btn = document.getElementById('delete-modal-confirm');
        if (btn) {
          const origClick = btn.onclick;
          btn.onclick = async () => {
            await deleteCompany(currentId);
            closeDeleteModal();
            showToast('Company deleted');
            setTimeout(() => { window.location.href = 'data.html'; }, 300);
          };
        }
      }, 50);
    }

    // ── Reminders Section ──
    function renderReminders(c) {
      if (!c) return;
      const reminders = getRemindersForCompany(c.id);
      const active = reminders.filter(r => !r.completed).sort((a,b) => (a.date||'').localeCompare(b.date||''));
      const completed = reminders.filter(r => r.completed);

      let html = `
        <div class="detail-section" style="margin-top:16px;">
          <h3>Reminders</h3>
          <form onsubmit="return addReminder(event)" style="margin-bottom:16px;">
            <div style="display:flex;gap:8px;">
              <input type="date" class="form-control" id="r-date" required style="flex:1;" />
              <input type="text" class="form-control" id="r-note" placeholder="Note" style="flex:2;" />
            </div>
            <button type="submit" class="btn btn-primary btn-sm mt-8">Add Reminder</button>
          </form>`;

      if (active.length === 0 && completed.length === 0) {
        html += `<p style="color:var(--text-muted);font-size:0.85rem;">No reminders set</p>`;
      }

      active.forEach(r => {
        html += `
          <div class="reminder-card">
            <div class="rc-note">${escHtml(r.note || 'Reminder')}</div>
            <div class="rc-date">📅 ${r.date}</div>
            <div class="rc-actions">
              <button class="btn btn-green btn-sm" onclick="completeReminder('${r.id}').then(()=>showToast('Done'))">✅ Done</button>
              <button class="btn btn-red btn-sm" onclick="deleteReminder('${r.id}').then(()=>showToast('Deleted'))">🗑️</button>
            </div>
          </div>`;
      });

      if (completed.length > 0) {
        html += `<div style="margin-top:12px;color:var(--text-muted);font-size:0.8rem;">Completed (${completed.length})</div>`;
        completed.forEach(r => {
          html += `<div class="reminder-card" style="opacity:0.5;">
            <div class="rc-note" style="text-decoration:line-through;">${escHtml(r.note || 'Reminder')}</div>
            <div class="rc-date">📅 ${r.date} — ✅ Completed</div>
          </div>`;
        });
      }

      html += `</div>`;
      document.getElementById('reminder-section').innerHTML = html;
    }

    function addReminder(e) {
      e.preventDefault();
      const date = document.getElementById('r-date').value;
      const note = document.getElementById('r-note').value.trim();
      if (!date) return false;

      const c = getCompany(currentId);
      saveReminder({
        id: genId(),
        companyId: currentId,
        companyName: c ? c.name : '',
        companyPhone: c ? c.phone : '',
        date,
        note,
        completed: false
      }).then(() => {
        showToast('Reminder added');
        document.getElementById('r-date').value = '';
        document.getElementById('r-note').value = '';
      });
      return false;
    }

    // ── Init ──
    document.addEventListener('DOMContentLoaded', () => {
      renderBottomNav('data');
      currentId = getIdFromUrl();

      if (!currentId) {
        document.getElementById('company-view').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">❌</div>
            <p>No company ID provided</p>
          </div>`;
        return;
      }

      onDataChange(() => {
        const c = getCompany(currentId);
        if (!editMode) renderView(c);
        renderReminders(c);
      });

      setTimeout(() => {
        const c = getCompany(currentId);
        renderView(c);
        renderReminders(c);
      }, 600);
    });
  </script>
</body>
</html>
