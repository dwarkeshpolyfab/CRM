<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#1a365d" />
  <title>Company – Dwarkesh Polyfab CRM</title>

  <!-- PWA – App Icon on Mobile Home Screen -->
  <link rel="manifest" href="../manifest.json" />
  <link rel="apple-touch-icon" href="../assets/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DP CRM" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="../assets/style.css" />
  <link rel="icon" href="../assets/icon-192.png" type="image/png" />
</head>
<body>

<div class="app">

  <!-- Company Detail Header -->
  <div class="company-detail-header" id="cd-header">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <button class="back-btn" onclick="history.back()">&#8592;</button>
      <h1 class="header-title">Company Detail</h1>
      <button onclick="confirmDelete()"
        style="width:36px;height:36px;border-radius:10px;background:rgba(239,68,68,.2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">
        🗑️
      </button>
    </div>

    <div style="display:flex;align-items:center;gap:16px">
      <div class="cd-avatar" id="cd-avatar">??</div>
      <div class="cd-info">
        <h2 class="cd-name" id="cd-name">—</h2>
        <p class="cd-meta" id="cd-meta">—</p>
        <div class="cd-links" id="cd-links"></div>
      </div>
    </div>
  </div>

  <!-- Status Row -->
  <div class="cd-status-row">
    <div>
      <p style="font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Status</p>
      <div class="dropdown-wrap">
        <button class="status-badge" id="status-btn" onclick="toggleStatus()">
          — <span style="font-size:8px">▼</span>
        </button>
        <div class="dropdown-list hidden" id="status-dropdown">
          <!-- built by JS -->
        </div>
        <div class="hidden" id="status-backdrop" onclick="closeStatus()" style="position:fixed;inset:0;z-index:20"></div>
      </div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="toggleAddReminder()">+ Add Reminder</button>
  </div>

  <!-- Add Reminder Form -->
  <div class="hidden" id="add-reminder-box" style="margin:12px 16px 0;background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:14px">
    <p style="font-size:12px;font-weight:700;color:#1a365d;margin-bottom:10px">📅 Schedule Follow-up Reminder</p>
    <div class="grid-2">
      <input type="date" class="input input-sm" id="new-reminder-date" />
      <input type="time" class="input input-sm" id="new-reminder-time" value="10:00" />
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="cancelReminder()">Cancel</button>
      <button class="btn btn-primary btn-sm" style="flex:1" onclick="saveNewReminder()">Save Reminder</button>
    </div>
  </div>

  <!-- Page Body -->
  <div class="page-body" style="padding-top:14px">

    <!-- Pending Reminders -->
    <div id="pending-section" class="hidden">
      <p class="section-label">📅 Upcoming Reminders</p>
      <div id="pending-list" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>

    <!-- Activity Timeline -->
    <div>
      <p class="section-label">📝 Activity History</p>
      <div id="activity-list"></div>
    </div>

  </div>
</div>

<!-- Delete Confirm -->
<div class="confirm-overlay hidden" id="delete-overlay">
  <div class="confirm-box">
    <span style="font-size:48px;display:block;margin-bottom:12px">⚠️</span>
    <h3 style="font-size:15px;font-weight:800;margin-bottom:6px">Delete Company?</h3>
    <p style="font-size:12px;color:#6b7280;margin-bottom:20px" id="delete-text">This will delete the company and all its data. Cannot be undone.</p>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeDeleteConfirm()">Cancel</button>
      <button class="btn btn-danger" style="flex:1" onclick="doDelete()">Delete</button>
    </div>
  </div>
</div>

<script src="../assets/app.js"></script>
<script>
  const params    = new URLSearchParams(window.location.search);
  const companyId = params.get('id');

  function loadCompany() {
    const company = getCompany(companyId);
    if (!company) {
      document.getElementById('cd-header').innerHTML = `
        <div style="text-align:center;padding:40px 20px">
          <span style="font-size:48px;display:block;margin-bottom:12px">🔍</span>
          <p style="font-size:14px;font-weight:700;color:#4b5563">Company not found</p>
          <a href="data.html" style="font-size:12px;color:#2563eb;font-weight:600;margin-top:8px;display:block">← Back to Data</a>
        </div>`;
      return;
    }

    document.title = company.name + ' – Dwarkesh Polyfab CRM';

    // Avatar & name
    document.getElementById('cd-avatar').textContent = initials(company.name);
    document.getElementById('cd-name').textContent   = company.name;
    document.getElementById('cd-meta').textContent   = `📍 ${company.city}   🏭 ${company.nature}`;

    // Phone links
    const linksEl = document.getElementById('cd-links');
    if (company.phone) {
      linksEl.innerHTML = `
        <a href="tel:${company.phone}" class="cd-link">📱 ${company.phone}</a>
        <a href="https://wa.me/91${company.phone.replace(/\D/g,'')}" target="_blank" class="cd-link whatsapp">💬 WhatsApp</a>`;
    }

    // Status button
    const statusBtn = document.getElementById('status-btn');
    statusBtn.className = 'status-badge ' + (STATUS_CLASS[company.status] || '');
    statusBtn.innerHTML = company.status + ' <span style="font-size:8px">▼</span>';

    // Status dropdown
    document.getElementById('status-dropdown').innerHTML = ALL_STATUSES.map(s => `
      <div class="dropdown-item ${s === company.status ? 'current' : ''}" onclick="doChangeStatus('${s}')">
        <span class="dropdown-dot ${STATUS_DOT[s]}"></span>
        ${s}
        ${s === company.status ? '<span style="margin-left:auto;color:#22c55e">✓</span>' : ''}
      </div>`).join('');

    // Set default reminder date
    document.getElementById('new-reminder-date').value = todayStr();

    // Pending reminders
    const db = loadData();
    const pending = db.reminders
      .filter(r => r.companyId === companyId && r.status === 'Pending')
      .sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));

    const pSection = document.getElementById('pending-section');
    const pList    = document.getElementById('pending-list');

    if (pending.length > 0) {
      pSection.classList.remove('hidden');
      pList.innerHTML = pending.map(r => `
        <div class="reminder-pill">
          <span class="pill-date">${fmtDate(r.date)} at ${fmtTime(r.time)}</span>
          <span class="pill-status">Pending</span>
        </div>`).join('');
    } else {
      pSection.classList.add('hidden');
    }

    // Activity timeline
    const activities = getCompanyActivities(companyId);
    const actList    = document.getElementById('activity-list');

    if (activities.length === 0) {
      actList.innerHTML = `
        <div class="card" style="text-align:center;padding:40px 20px">
          <span style="font-size:40px;display:block;margin-bottom:10px">📭</span>
          <p style="font-size:12px;font-weight:700;color:#6b7280">No activity recorded yet</p>
          <p style="font-size:10px;color:#9ca3af;margin-top:4px">Activities appear here after follow-ups</p>
        </div>`;
    } else {
      actList.innerHTML = activities.map(act => `
        <div class="activity-card fade-in" style="margin-bottom:10px">
          <div class="activity-head">
            <div class="activity-type">
              <span>${ACTIVITY_ICON[act.type] || '📌'}</span>
              <span>${act.type}</span>
            </div>
            <span class="activity-date">${fmtDate(act.createdAt.split('T')[0])}</span>
          </div>
          <p class="activity-notes">${act.notes}</p>
          ${act.nextFollowUpDate ? `
            <p class="activity-next">
              📅 Next: ${fmtDate(act.nextFollowUpDate)} at ${fmtTime(act.nextFollowUpTime)}
            </p>` : ''}
        </div>`).join('');
    }
  }

  // ── Status dropdown ──
  function toggleStatus() {
    const dd = document.getElementById('status-dropdown');
    const bb = document.getElementById('status-backdrop');
    const isOpen = !dd.classList.contains('hidden');
    if (isOpen) closeStatus();
    else { dd.classList.remove('hidden'); bb.classList.remove('hidden'); }
  }
  function closeStatus() {
    document.getElementById('status-dropdown').classList.add('hidden');
    document.getElementById('status-backdrop').classList.add('hidden');
  }
  function doChangeStatus(status) {
    changeStatus(companyId, status);
    closeStatus();
    loadCompany();
  }

  // ── Add Reminder ──
  function toggleAddReminder() {
    const box = document.getElementById('add-reminder-box');
    box.classList.toggle('hidden');
  }
  function cancelReminder() {
    document.getElementById('add-reminder-box').classList.add('hidden');
  }
  function saveNewReminder() {
    const date = document.getElementById('new-reminder-date').value;
    const time = document.getElementById('new-reminder-time').value || '10:00';
    if (!date) { alert('Please select a date'); return; }
    addReminder(companyId, date, time);
    document.getElementById('add-reminder-box').classList.add('hidden');
    loadCompany();
  }

  // ── Delete ──
  function confirmDelete() {
    const company = getCompany(companyId);
    if (!company) return;
    document.getElementById('delete-text').textContent =
      `This will delete "${company.name}" and all its reminders and activity history. This cannot be undone.`;
    document.getElementById('delete-overlay').classList.remove('hidden');
  }
  function closeDeleteConfirm() {
    document.getElementById('delete-overlay').classList.add('hidden');
  }
  function doDelete() {
    deleteCompany(companyId);
    window.location.href = 'data.html';
  }

  loadCompany();
</script>
</body>
</html>
