<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reminders — Dwarkesh CRM</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <meta name="theme-color" content="#0f172a" />
</head>
<body>

  <!-- Header -->
  <div class="app-header">
    <img src="../assets/logo.png" alt="Logo" class="logo" />
    <div>
      <h1>Reminders</h1>
      <div class="subtitle">Dwarkesh Polyfab CRM</div>
    </div>
  </div>

  <div class="container">

    <!-- Tabs -->
    <div class="tabs" id="reminder-tabs">
      <button class="tab-btn active" data-tab="today" onclick="switchTab('today', this)">
        📅 Today <span class="tab-badge" id="badge-today">0</span>
      </button>
      <button class="tab-btn" data-tab="upcoming" onclick="switchTab('upcoming', this)">
        🔜 Upcoming <span class="tab-badge" id="badge-upcoming">0</span>
      </button>
      <button class="tab-btn" data-tab="missed" onclick="switchTab('missed', this)">
        ⚠️ Missed <span class="tab-badge" id="badge-missed">0</span>
      </button>
    </div>

    <!-- Reminder List -->
    <div id="reminder-list"></div>

  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="../assets/app.js"></script>

  <script>
    let activeTab = 'today';

    function switchTab(tab, btn) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderReminders();
    }

    function renderReminders() {
      const today = getTodayReminders();
      const upcoming = getUpcomingReminders();
      const missed = getMissedReminders();

      // Update badges
      document.getElementById('badge-today').textContent = today.length;
      document.getElementById('badge-upcoming').textContent = upcoming.length;
      document.getElementById('badge-missed').textContent = missed.length;

      let list = [];
      if (activeTab === 'today') list = today;
      else if (activeTab === 'upcoming') list = upcoming.sort((a,b) => (a.date||'').localeCompare(b.date||''));
      else list = missed.sort((a,b) => (b.date||'').localeCompare(a.date||''));

      const el = document.getElementById('reminder-list');

      if (list.length === 0) {
        const msgs = {
          today: 'No reminders for today 🎉',
          upcoming: 'No upcoming reminders',
          missed: 'No missed reminders ✅'
        };
        el.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${activeTab === 'missed' ? '✅' : '📭'}</div>
            <p>${msgs[activeTab]}</p>
          </div>`;
        return;
      }

      el.innerHTML = list.map(r => {
        const phone = r.companyPhone || '';
        return `
          <div class="reminder-card fade-in">
            <div class="rc-company">${escHtml(r.companyName || 'Unknown')}</div>
            <div class="rc-note">${escHtml(r.note || 'No note')}</div>
            <div class="rc-date">📅 ${r.date}${phone ? ' • 📞 ' + escHtml(phone) : ''}</div>
            <div class="rc-actions">
              <button class="btn btn-green btn-sm" onclick="openWhatsApp('${escAttr(phone)}')">📱 WhatsApp</button>
              <button class="btn btn-primary btn-sm" onclick="callPhone('${escAttr(phone)}')">📞 Call</button>
              <button class="btn btn-outline btn-sm" onclick="markDone('${r.id}')">✅ Done</button>
              <button class="btn btn-red btn-sm" onclick="removeDel('${r.id}')">🗑️</button>
            </div>
          </div>`;
      }).join('');
    }

    function markDone(id) {
      completeReminder(id).then(() => showToast('Reminder completed'));
    }

    function removeDel(id) {
      deleteReminder(id).then(() => showToast('Reminder deleted'));
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderBottomNav('reminders');

      // Check URL param for tab
      const params = new URLSearchParams(window.location.search);
      const tabParam = params.get('tab');
      if (tabParam && ['today','upcoming','missed'].includes(tabParam)) {
        activeTab = tabParam;
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.tab === activeTab);
        });
      }

      onDataChange(renderReminders);
      setTimeout(renderReminders, 500);
    });
  </script>
</body>
</html>
