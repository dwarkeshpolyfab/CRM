<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reminders — Dwarkesh CRM</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <meta name="theme-color" content="#112a46" />
</head>
<body>

  <!-- App Header -->
  <div class="app-header">
    <a href="../index.html" class="back-btn" title="Back to Home">‹</a>
    <img src="../assets/logo.png" alt="Logo" class="brand-logo sm" />
    <div class="brand-info">
      <h1 class="brand-title">FOLLOW-UP REMINDERS</h1>
      <div class="brand-tagline">Track Calls & Schedule Next Dates</div>
    </div>
  </div>

  <div class="container">

    <!-- 3 Reminder Tabs -->
    <div class="reminder-tabs">
      <button class="rtab active" id="tab-today-btn" onclick="switchTab('today')">
        📅 Today <span class="tab-badge green" id="badge-today">0</span>
      </button>
      <button class="rtab" id="tab-missed-btn" onclick="switchTab('missed')">
        ⚠️ Missed <span class="tab-badge red" id="badge-missed">0</span>
      </button>
      <button class="rtab" id="tab-upcoming-btn" onclick="switchTab('upcoming')">
        ⏳ Upcoming <span class="tab-badge" id="badge-upcoming">0</span>
      </button>
    </div>

    <!-- Reminder Cards List -->
    <div id="reminders-list" style="margin-top:14px;"></div>

  </div>

  <!-- Reschedule Modal -->
  <div class="modal-overlay" id="reschedule-modal">
    <div class="modal-box">
      <h3 style="color:var(--gold-light);">📅 Reschedule Follow-up</h3>
      <p id="reschedule-customer-name" style="font-weight:700;color:#fff;margin-bottom:12px;"></p>
      
      <div class="form-group">
        <label>New Follow-up Date <span class="required">*</span></label>
        <input type="date" class="form-control" id="reschedule-date" required />
      </div>

      <div class="form-group" style="margin-top:10px;">
        <label>Next Step / Note</label>
        <input type="text" class="form-control" id="reschedule-note" placeholder="e.g. Call for price negotiation..." />
      </div>

      <div class="modal-actions" style="margin-top:18px;">
        <button class="btn btn-outline" onclick="closeRescheduleModal()">Cancel</button>
        <button class="btn btn-primary" onclick="confirmReschedule()">Save & Remove from Today</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="../assets/app.js"></script>

  <script>
    let currentTab = 'today';
    let targetReminderId = null;
    let targetCompanyId = null;
    let targetCompanyName = null;

    function initTabFromUrl() {
      const p = new URLSearchParams(window.location.search);
      const tabParam = p.get('tab');
      if (tabParam === 'missed' || tabParam === 'upcoming' || tabParam === 'today') {
        currentTab = tabParam;
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.rtab').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-${tab}-btn`);
      if (activeBtn) activeBtn.classList.add('active');
      renderRemindersPage();
    }

    function renderRemindersPage() {
      const todayRem = getTodayReminders();
      const missedRem = getMissedReminders();
      const upRem = getUpcomingReminders();

      // Update badge counts
      const bToday = document.getElementById('badge-today');
      const bMissed = document.getElementById('badge-missed');
      const bUpcoming = document.getElementById('badge-upcoming');
      if (bToday) bToday.textContent = todayRem.length;
      if (bMissed) bMissed.textContent = missedRem.length;
      if (bUpcoming) bUpcoming.textContent = upRem.length;

      let list = [];
      if (currentTab === 'today') list = todayRem;
      else if (currentTab === 'missed') list = missedRem;
      else if (currentTab === 'upcoming') list = upRem;

      const container = document.getElementById('reminders-list');
      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${currentTab === 'missed' ? '🎉' : '⏰'}</div>
            <p>${currentTab === 'missed' ? 'No missed reminders! All caught up.' : 'No reminders in this tab.'}</p>
          </div>`;
        return;
      }

      container.innerHTML = list.map(r => {
        const c = getCompany(r.companyId);
        const name = r.companyName || (c ? c.name : 'Customer');
        const phone = r.companyPhone || (c ? c.phone : '');
        const isMissed = (currentTab === 'missed');

        return `
          <div class="reminder-card fade-in ${isMissed ? 'missed' : ''}">
            <div class="rc-top" onclick="window.location.href='company.html?id=${r.companyId}'" style="cursor:pointer;">
              <div>
                <div class="rc-name">${escHtml(name)}</div>
                <div class="rc-note">${escHtml(r.note || 'Follow-up call')}</div>
              </div>
              <div class="rc-date-badge ${isMissed ? 'red' : ''}">
                ${isMissed ? '⚠️ Missed: ' : '📅 '} ${r.date}
              </div>
            </div>

            <div class="rc-actions" style="margin-top:12px;display:flex;gap:6px;">
              <button class="btn btn-green btn-sm flex-1" onclick="openWhatsApp('${escAttr(phone)}')">
                💬 WhatsApp
              </button>
              <button class="btn btn-primary btn-sm flex-1" onclick="callPhone('${escAttr(phone)}')">
                📞 Call
              </button>
              <button class="btn btn-outline btn-sm flex-1" style="border-color:var(--gold);color:var(--gold-light);" onclick="openRescheduleModal('${r.id}', '${escAttr(name)}', '${r.companyId}', '${escAttr(r.note||'')}')">
                📅 Next Date
              </button>
              <button class="btn btn-outline btn-sm" onclick="handleCompleteReminder('${r.id}')" title="Mark Done">
                ✅ Done
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openRescheduleModal(remId, compName, compId, currentNote) {
      targetReminderId = remId;
      targetCompanyId = compId;
      targetCompanyName = compName;

      document.getElementById('reschedule-customer-name').textContent = compName;
      document.getElementById('reschedule-note').value = currentNote;
      document.getElementById('reschedule-date').value = '';

      document.getElementById('reschedule-modal').classList.add('open');
      document.getElementById('reschedule-date').focus();
    }

    function closeRescheduleModal() {
      document.getElementById('reschedule-modal').classList.remove('open');
      targetReminderId = null;
      targetCompanyId = null;
      targetCompanyName = null;
    }

    // 🌟 SMART ROLLOVER: Completes current reminder, adds new date, removes from Today! 🌟
    async function confirmReschedule() {
      const newDate = document.getElementById('reschedule-date').value;
      const newNote = document.getElementById('reschedule-note').value.trim();

      if (!newDate) {
        alert('Please choose a new follow-up date!');
        return;
      }

      // 1. Complete the existing reminder (so it NO LONGER shows on Today or Missed!)
      if (targetReminderId) {
        await completeReminder(targetReminderId);
      }

      // 2. Save the new reminder for the chosen date
      const c = getCompany(targetCompanyId);
      await saveReminder({
        id: genId(),
        companyId: targetCompanyId,
        companyName: targetCompanyName || (c ? c.name : ''),
        companyPhone: c ? c.phone : '',
        date: newDate,
        note: newNote || 'Follow-up Call',
        completed: false
      });

      closeRescheduleModal();
      showToast('✅ Next date set! Removed from Today.');
      renderRemindersPage();
    }

    function handleCompleteReminder(id) {
      completeReminder(id).then(() => {
        showToast('✅ Reminder Completed!');
        renderRemindersPage();
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderBottomNav('reminders');
      initTabFromUrl();
      switchTab(currentTab);
      onDataChange(renderRemindersPage);
      setTimeout(renderRemindersPage, 300);
    });
  </script>
</body>
</html>
