<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Add Contact — Dwarkesh CRM</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <meta name="theme-color" content="#0f172a" />
</head>
<body>

  <!-- Header -->
  <div class="app-header">
    <img src="../assets/logo.png" alt="Logo" class="logo" />
    <div>
      <h1>Add New Contact</h1>
      <div class="subtitle">Dwarkesh Polyfab CRM</div>
    </div>
  </div>

  <!-- Form -->
  <div class="container">
    <form id="add-form" onsubmit="return handleSubmit(event)">

      <!-- Name -->
      <div class="form-group">
        <label>Company Name <span class="required">*</span></label>
        <input type="text" class="form-control" id="f-name" placeholder="Enter company name" required />
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label>Phone Number <span class="required">*</span></label>
        <input type="tel" class="form-control" id="f-phone" placeholder="Enter phone number" required />
      </div>

      <!-- State -->
      <div class="form-group">
        <label>State <span class="required">*</span></label>
        <select class="form-control" id="f-state" required></select>
      </div>

      <!-- City -->
      <div class="form-group">
        <label>City</label>
        <input type="text" class="form-control" id="f-city" placeholder="Enter city (optional)" />
      </div>

      <!-- Rating -->
      <div class="form-group">
        <label>Rating <span class="required">*</span></label>
        <div class="radio-group" id="f-rating">
          <label><input type="radio" name="rating" value="not_important" required /> Not Important</label>
          <label><input type="radio" name="rating" value="3star" /> ⭐⭐⭐</label>
          <label><input type="radio" name="rating" value="4star" /> ⭐⭐⭐⭐</label>
          <label><input type="radio" name="rating" value="5star" /> ⭐⭐⭐⭐⭐</label>
        </div>
      </div>

      <!-- Products -->
      <div class="form-group">
        <label>Products <span class="required">*</span> (select at least 1)</label>
        <div class="checkbox-group" id="f-products"></div>
        <div id="other-product-wrap" class="hidden" style="margin-top:10px;">
          <input type="text" class="form-control" id="f-other-product" placeholder="Specify other product" />
        </div>
      </div>

      <!-- Notes -->
      <div class="form-group">
        <label>Requirements / Notes</label>
        <textarea class="form-control" id="f-notes" placeholder="Enter notes or requirements (optional)"></textarea>
      </div>

      <!-- Quick Actions -->
      <div class="action-row mb-16">
        <button type="button" class="btn btn-green" style="flex:1" onclick="quickWhatsApp()">📱 WhatsApp</button>
        <button type="button" class="btn btn-primary" style="flex:1" onclick="quickCall()">📞 Call</button>
      </div>

      <!-- Save -->
      <button type="submit" class="btn btn-primary btn-block" id="save-btn" style="padding:14px; font-size:1rem;">
        💾 Save Contact
      </button>
    </form>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="../assets/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderBottomNav('add');
      populateStateDropdown(document.getElementById('f-state'), '');
      buildProductCheckboxes();
    });

    function buildProductCheckboxes() {
      const wrap = document.getElementById('f-products');
      wrap.innerHTML = PRODUCT_OPTIONS.map(p =>
        `<label><input type="checkbox" name="products" value="${p.value}" onchange="onProductChange()" /> ${p.label}</label>`
      ).join('');
    }

    function onProductChange() {
      const otherChecked = document.querySelector('input[name="products"][value="other"]');
      document.getElementById('other-product-wrap').classList.toggle('hidden', !otherChecked || !otherChecked.checked);
    }

    function quickWhatsApp() {
      const phone = document.getElementById('f-phone').value;
      if (!phone) { showToast('Enter phone number first'); return; }
      openWhatsApp(phone);
    }

    function quickCall() {
      const phone = document.getElementById('f-phone').value;
      if (!phone) { showToast('Enter phone number first'); return; }
      callPhone(phone);
    }

    function handleSubmit(e) {
      e.preventDefault();

      const name = document.getElementById('f-name').value.trim();
      const phone = document.getElementById('f-phone').value.trim();
      const state = document.getElementById('f-state').value;
      const city = document.getElementById('f-city').value.trim();
      const notes = document.getElementById('f-notes').value.trim();
      const otherProduct = document.getElementById('f-other-product').value.trim();

      // Rating
      const ratingEl = document.querySelector('input[name="rating"]:checked');
      if (!ratingEl) { showToast('Please select a rating'); return false; }
      const rating = ratingEl.value;

      // Products
      const checkedProducts = Array.from(document.querySelectorAll('input[name="products"]:checked')).map(el => el.value);
      if (checkedProducts.length === 0) { showToast('Please select at least one product'); return false; }

      const company = {
        id: genId(),
        name,
        phone,
        state,
        city,
        rating,
        products: checkedProducts,
        otherProduct: checkedProducts.includes('other') ? otherProduct : '',
        companyNotes: notes,
        nature: '',
        status: 'Untouch',
        segment: 'new_arrival',
        source: 'manual',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      document.getElementById('save-btn').disabled = true;
      document.getElementById('save-btn').textContent = 'Saving...';

      saveCompany(company).then(() => {
        showToast('Contact saved!');
        setTimeout(() => { window.location.href = 'data.html'; }, 600);
      }).catch(err => {
        showToast('Error: ' + err.message);
        document.getElementById('save-btn').disabled = false;
        document.getElementById('save-btn').textContent = '💾 Save Contact';
      });

      return false;
    }
  </script>
</body>
</html>
