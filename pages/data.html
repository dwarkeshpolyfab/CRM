<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>All Data — Dwarkesh CRM</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <meta name="theme-color" content="#112a46" />
</head>
<body>

  <!-- App Header -->
  <div class="app-header">
    <a href="../index.html" class="back-btn" title="Back to Home">&#8592;</a>
    <img src="../assets/logo.png" alt="Logo" class="brand-logo sm" />
    <div class="brand-info">
      <h1 class="brand-title" id="page-heading">ALL DATA</h1>
      <div class="brand-tagline" id="page-subheading">Sorted: High to Low Stars</div>
    </div>
  </div>

  <div class="container">

    <!-- Top Compact One-Line Bar (Search + Filter Toggle) -->
    <div class="search-filter-row" id="search-filter-bar">
      <input type="text" class="form-control search-input" id="inp-search" placeholder="Search name, phone, place..." />
      <button class="btn btn-filter" id="btn-toggle-filter" onclick="toggleFilterDrawer()">
        Filters <span class="filter-count-badge hidden" id="active-filter-badge">0</span>
      </button>
    </div>

    <!-- Collapsible Filter Drawer (Hidden by Default) -->
    <div class="filter-drawer hidden" id="filter-drawer">
      <div class="filter-drawer-header">
        <span>Filter Companies</span>
        <button class="btn-text-sm" onclick="resetFilters()">Reset All</button>
      </div>

      <!-- Rating Filter -->
      <div class="filter-group">
        <label class="fg-title">Star Rating</label>
        <div class="chip-row" id="rating-chips">
          <button class="chip active" data-rating="all">All</button>
          <button class="chip" data-rating="5star">★★★★★</button>
          <button class="chip" data-rating="4star">★★★★</button>
          <button class="chip" data-rating="3star">★★★</button>
          <button class="chip" data-rating="not_important">Not Important</button>
        </div>
      </div>

      <!-- Place Filter (Searchable) -->
      <div class="filter-group">
        <label class="fg-title">Place (State / India / Export)</label>
        <input type="text" class="form-control" id="f-place" list="place-filter-list" placeholder="Type place (e.g. Gu for Gujarat)..." />
        <datalist id="place-filter-list"></datalist>
      </div>

      <!-- Product Filter -->
      <div class="filter-group">
        <label class="fg-title">Product Requirement</label>
        <div class="chip-row wrap" id="product-chips"></div>
      </div>

      <div class="filter-drawer-actions">
        <button class="btn btn-primary btn-block" onclick="applyFiltersAndClose()">Apply & Close</button>
      </div>
    </div>

    <!-- Active Filter Summary & Result Count -->
    <div class="result-count-bar">
      <span id="results-count">Loading contacts...</span>
      <span class="badge-sort">&#9733; High to Low</span>
    </div>

    <!-- Company List Container -->
    <div id="company-list"></div>

  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="../assets/app.js"></script>

  <script>
    let isNewArrivalView = false;
    let currentFilters = {
      search: '',
      rating: 'all',
      place: 'all',
      product: 'all'
    };

    function parseViewMode() {
      const p = new URLSearchParams(window.location.search);
      isNewArrivalView = (p.get('view') === 'new_arrival' || p.get('segment') === 'new_arrival');

      if (isNewArrivalView) {
        document.getElementById('page-heading').textContent = 'NEW ARRIVALS';
        document.getElementById('page-subheading').textContent = 'Tap to Set Stars, Place & Products';
        document.getElementById('search-filter-bar').style.display = 'none';
        document.getElementById('filter-drawer').style.display = 'none';
      }
    }

    function toggleFilterDrawer() {
      const drawer = document.getElementById('filter-drawer');
      drawer.classList.toggle('hidden');
    }

    function applyFiltersAndClose() {
      const pInput = document.getElementById('f-place').value.trim();
      currentFilters.place = pInput || 'all';
      renderList();
      updateFilterBadge();
      document.getElementById('filter-drawer').classList.add('hidden');
    }

    function resetFilters() {
      currentFilters = { search: '', rating: 'all', place: 'all', product: 'all' };
      document.getElementById('inp-search').value = '';
      document.getElementById('f-place').value = '';
      document.querySelectorAll('#rating-chips .chip').forEach(c => c.classList.toggle('active', c.dataset.rating === 'all'));
      document.querySelectorAll('#product-chips .chip').forEach(c => c.classList.toggle('active', c.dataset.product === 'all'));
      renderList();
      updateFilterBadge();
    }

    function updateFilterBadge() {
      let count = 0;
      if (currentFilters.rating !== 'all') count++;
      if (currentFilters.place !== 'all') count++;
      if (currentFilters.product !== 'all') count++;

      const b = document.getElementById('active-filter-badge');
      if (count > 0) {
        b.textContent = count;
        b.classList.remove('hidden');
      } else {
        b.classList.add('hidden');
      }
    }

    function renderList() {
      const filterOpts = {
        search: currentFilters.search,
        rating: currentFilters.rating,
        place: currentFilters.place,
        product: currentFilters.product,
        onlyNewArrival: isNewArrivalView,
        hideNewArrival: false
      };

      const list = filterCompanies(filterOpts);
      const countEl = document.getElementById('results-count');
      const listEl = document.getElementById('company-list');

      if (countEl) {
        countEl.textContent = isNewArrivalView
          ? `${list.length} New Arrival Contact${list.length === 1 ? '' : 's'}`
          : `Showing ${list.length} Contact${list.length === 1 ? '' : 's'}`;
      }

      if (list.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">&#128269;</div>
            <p>${isNewArrivalView ? 'No pending New Arrivals! All contacts are categorized.' : 'No contacts match your search or filters.'}</p>
          </div>`;
        return;
      }

      listEl.innerHTML = list.map(c => {
        const targetUrl = isNewArrivalView ? `company.html?id=${c.id}&autoEdit=1&from=new_arrival` : `company.html?id=${c.id}`;
        return buildCompanyCard(c, { basePath: '', linkTo: true, customUrl: targetUrl });
      }).join('');
    }

    function setupRatingChips() {
      document.querySelectorAll('#rating-chips .chip').forEach(chip => {
        chip.addEventListener('click', () => {
          document.querySelectorAll('#rating-chips .chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          currentFilters.rating = chip.dataset.rating;
          renderList();
          updateFilterBadge();
        });
      });
    }

    function setupProductChips() {
      const row = document.getElementById('product-chips');
      let html = `<button class="chip active" data-product="all">All</button>`;
      PRODUCT_OPTIONS.forEach(p => {
        html += `<button class="chip" data-product="${p.value}">${p.label}</button>`;
      });
      row.innerHTML = html;

      row.querySelectorAll('.chip').forEach(chip => {
        chip.addEventListener('click', () => {
          row.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          currentFilters.product = chip.dataset.product;
          renderList();
          updateFilterBadge();
        });
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderBottomNav('data');
      parseViewMode();
      renderPlaceDatalist('place-filter-list');
      setupRatingChips();
      setupProductChips();

      const sInp = document.getElementById('inp-search');
      if (sInp) {
        sInp.addEventListener('input', e => {
          currentFilters.search = e.target.value;
          renderList();
        });
      }

      onDataChange(renderList);
      setTimeout(renderList, 300);
    });
  </script>
</body>
</html>
