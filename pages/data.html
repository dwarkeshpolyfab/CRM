<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>All Data — Dwarkesh CRM</title>
  <link rel="stylesheet" href="../assets/style.css" />
  <meta name="theme-color" content="#0f172a" />
</head>
<body>

  <!-- Header -->
  <div class="app-header">
    <img src="../assets/logo.png" alt="Logo" class="logo" />
    <div>
      <h1>All Companies</h1>
      <div class="subtitle">Filter & Browse</div>
    </div>
  </div>

  <div class="container">

    <!-- Search -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search name, phone, city..." oninput="applyFilters()" />
    </div>

    <!-- Filters -->
    <div class="filter-bar">

      <!-- Rating Filter -->
      <div class="filter-section">
        <div class="filter-label">Rating</div>
        <div class="chips" id="rating-chips">
          <div class="chip active" data-value="all" onclick="setChip('rating', this)">All</div>
          <div class="chip" data-value="not_important" onclick="setChip('rating', this)">Not Important</div>
          <div class="chip" data-value="3star" onclick="setChip('rating', this)">⭐⭐⭐</div>
          <div class="chip" data-value="4star" onclick="setChip('rating', this)">⭐⭐⭐⭐</div>
          <div class="chip" data-value="5star" onclick="setChip('rating', this)">⭐⭐⭐⭐⭐</div>
        </div>
      </div>

      <!-- State Filter -->
      <div class="filter-section">
        <div class="filter-label">State</div>
        <select class="form-control" id="state-filter" onchange="applyFilters()" style="padding:8px 12px; font-size:0.85rem;"></select>
      </div>

      <!-- Product Filter -->
      <div class="filter-section">
        <div class="filter-label">Product</div>
        <div class="chips" id="product-chips">
          <div class="chip active" data-value="all" onclick="setChip('product', this)">All</div>
        </div>
      </div>

      <!-- Status Filter -->
      <div class="filter-section">
        <div class="filter-label">Status</div>
        <div class="chips" id="status-chips">
          <div class="chip active" data-value="all" onclick="setChip('status', this)">All</div>
          <div class="chip" data-value="Untouch" onclick="setChip('status', this)">Untouch</div>
          <div class="chip" data-value="Follow-up" onclick="setChip('status', this)">Follow-up</div>
          <div class="chip" data-value="Mature" onclick="setChip('status', this)">Mature</div>
          <div class="chip" data-value="Need to Visit" onclick="setChip('status', this)">Need to Visit</div>
          <div class="chip" data-value="No Need to Follow" onclick="setChip('status', this)">No Need</div>
        </div>
      </div>

      <!-- Segment Filter -->
      <div class="filter-section">
        <div class="filter-label">Segment</div>
        <div class="chips" id="segment-chips">
          <div class="chip active" data-value="all" onclick="setChip('segment', this)">All</div>
          <div class="chip" data-value="new_arrival" onclick="setChip('segment', this)">New Arrival</div>
          <div class="chip" data-value="follow_up" onclick="setChip('segment', this)">Follow Up</div>
          <div class="chip" data-value="mature" onclick="setChip('segment', this)">Mature</div>
          <div class="chip" data-value="not_important" onclick="setChip('segment', this)">Not Important</div>
        </div>
      </div>
    </div>

    <!-- Result Count -->
    <div class="result-count" id="result-count"></div>

    <!-- Company List -->
    <div id="company-list"></div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="../assets/app.js"></script>

  <script>
    // Active filter state
    const activeFilters = {
      search: '',
      rating: 'all',
      state: 'all',
      product: 'all',
      status: 'all',
      segment: 'all'
    };

    function setChip(filterType, el) {
      const parent = el.parentElement;
      parent.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      activeFilters[filterType] = el.dataset.value;
      applyFilters();
    }

    function applyFilters() {
      activeFilters.search = document.getElementById('search-input').value.trim();
      activeFilters.state = document.getElementById('state-filter').value;

      const filtered = filterCompanies(activeFilters);
      renderList(filtered);
    }

    function renderList(list) {
      const el = document.getElementById('company-list');
      document.getElementById('result-count').textContent = `${list.length} compan${list.length === 1 ? 'y' : 'ies'} found`;

      if (list.length === 0) {
        el.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <p>No companies match your filters</p>
          </div>`;
        return;
      }

      // Sort by updatedAt desc
      list.sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
      el.innerHTML = list.map(c => buildCompanyCard(c, { basePath: '' })).join('');
    }

    function buildProductChips() {
      const wrap = document.getElementById('product-chips');
      const existing = wrap.innerHTML;
      PRODUCT_OPTIONS.forEach(p => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.dataset.value = p.value;
        chip.textContent = p.label;
        chip.onclick = function() { setChip('product', this); };
        wrap.appendChild(chip);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderBottomNav('data');
      populateStateFilter(document.getElementById('state-filter'), 'all');
      buildProductChips();

      // Check URL params for preset filters
      const params = new URLSearchParams(window.location.search);
      if (params.get('segment')) {
        activeFilters.segment = params.get('segment');
        // Activate the right chip
        document.querySelectorAll('#segment-chips .chip').forEach(c => {
          c.classList.toggle('active', c.dataset.value === activeFilters.segment);
        });
      }

      onDataChange(() => applyFilters());
      setTimeout(() => applyFilters(), 500);
    });
  </script>
</body>
</html>
