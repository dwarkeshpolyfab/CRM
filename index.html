<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dwarkesh Polyfab CRM</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
</head>
<body>

  <!-- Header -->
  <div class="app-header">
    <img src="assets/logo.png" alt="Logo" class="logo" />
    <div>
      <h1>Dwarkesh Polyfab CRM</h1>
      <div class="subtitle">Company Management System</div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container" id="home-container">
    <!-- Sections will be rendered by JS -->
    <div id="home-sections"></div>

    <div style="margin-top: 24px; text-align: center;">
      <button class="btn btn-outline btn-sm" onclick="exportBackup()">📥 Export Backup</button>
      <label class="btn btn-outline btn-sm" style="cursor:pointer;">
        📤 Import Backup
        <input type="file" accept=".json" style="display:none" onchange="importBackup(this.files[0])" />
      </label>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="assets/app.js"></script>

  <script>
    function renderHome() {
      const newCount = getNewArrivalsCount();
      const todayCount = getTodayReminders().length;
      const missedCount = getMissedReminders().length;
      const totalCount = getAllCompanies().length;

      const el = document.getElementById('home-sections');
      el.innerHTML = `
        <a class="section-card fade-in" href="pages/data.html?segment=new_arrival">
          <div class="sc-left">
            <div class="sc-icon blue">🆕</div>
            <div>
              <div class="sc-title">New Arrivals</div>
              <div class="sc-sub">Recently added contacts</div>
            </div>
          </div>
          <div class="sc-badge">${newCount}</div>
        </a>

        <a class="section-card fade-in" href="pages/reminders.html?tab=today">
          <div class="sc-left">
            <div class="sc-icon green">📅</div>
            <div>
              <div class="sc-title">Today's Reminders</div>
              <div class="sc-sub">Tasks due today</div>
            </div>
          </div>
          <div class="sc-badge green-badge">${todayCount}</div>
        </a>

        <a class="section-card fade-in" href="pages/reminders.html?tab=missed">
          <div class="sc-left">
            <div class="sc-icon red">⚠️</div>
            <div>
              <div class="sc-title">Missed Reminders</div>
              <div class="sc-sub">Overdue tasks</div>
            </div>
          </div>
          <div class="sc-badge red-badge">${missedCount}</div>
        </a>

        <a class="section-card fade-in" href="pages/data.html">
          <div class="sc-left">
            <div class="sc-icon purple">📊</div>
            <div>
              <div class="sc-title">All Data</div>
              <div class="sc-sub">Browse & filter companies</div>
            </div>
          </div>
          <div class="sc-badge">${totalCount}</div>
        </a>

        <a class="section-card fade-in" href="pages/add.html">
          <div class="sc-left">
            <div class="sc-icon orange">➕</div>
            <div>
              <div class="sc-title">Add New Contact</div>
              <div class="sc-sub">Add a company to CRM</div>
            </div>
          </div>
          <div class="sc-badge" style="background:transparent;color:var(--text-muted);">→</div>
        </a>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderBottomNav('home');
      onDataChange(renderHome);
      // Initial render in case data already loaded
      setTimeout(renderHome, 500);
    });
  </script>
</body>
</html>
