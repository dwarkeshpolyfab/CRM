<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dwarkesh Polyfab — Smart CRM</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#112a46" />
</head>
<body>

  <!-- Live Date & Time Bar -->
  <div class="top-clock-bar" id="top-live-clock">
    Loading live time...
  </div>

  <!-- Center Brand Hero Header (Matching dwarkeshpolyfab.com) -->
  <div class="brand-hero-header">
    <img src="assets/logo.png" alt="Dwarkesh Polyfab Logo" class="brand-center-logo" />
    <h1 class="brand-center-title">DWARKESH POLYFAB</h1>
    <div class="brand-center-tagline">WOVEN PACKAGING SOLUTION</div>
  </div>

  <div class="container home-container">

    <!-- Lower Middle: 3 Smart Status Boxes in One Row -->
    <div class="three-box-grid">
      <!-- 1. New Arrival (from Gmail) -->
      <a class="kpi-box box-new-arrival fade-in" href="pages/data.html?view=new_arrival">
        <div class="kpi-top">
          <span class="kpi-icon">🆕</span>
          <span class="kpi-count" id="count-new-arrival">0</span>
        </div>
        <div class="kpi-title">New Arrival</div>
        <div class="kpi-sub">Saved from Gmail</div>
      </a>

      <!-- 2. Today's Reminder -->
      <a class="kpi-box box-today-reminder fade-in" href="pages/reminders.html?tab=today">
        <div class="kpi-top">
          <span class="kpi-icon">📅</span>
          <span class="kpi-count" id="count-today-reminder">0</span>
        </div>
        <div class="kpi-title">Today's Reminder</div>
        <div class="kpi-sub">Due Today</div>
      </a>

      <!-- 3. Missed Reminder -->
      <a class="kpi-box box-missed-reminder fade-in" href="pages/reminders.html?tab=missed">
        <div class="kpi-top">
          <span class="kpi-icon">⚠️</span>
          <span class="kpi-count" id="count-missed-reminder">0</span>
        </div>
        <div class="kpi-title">Missed Reminder</div>
        <div class="kpi-sub">Overdue Tasks</div>
      </a>
    </div>

    <!-- Quick Navigation Action Cards in Lower Middle -->
    <div class="home-actions-list">
      <a class="main-action-card card-all-data fade-in" href="pages/data.html">
        <div class="mac-left">
          <span class="mac-icon">📊</span>
          <div>
            <div class="mac-title">All Data</div>
            <div class="mac-sub">Ranked ⭐⭐⭐⭐⭐ High to Low Stars</div>
          </div>
        </div>
        <div class="mac-badge" id="count-all-data">0</div>
      </a>

      <a class="main-action-card card-add fade-in" href="pages/add.html">
        <div class="mac-left">
          <span class="mac-icon">➕</span>
          <div>
            <div class="mac-title">Add New Contact</div>
            <div class="mac-sub">Direct input with Place & Stars</div>
          </div>
        </div>
        <span class="mac-arrow">➔</span>
      </a>
    </div>

    <!-- Backup Controls -->
    <div class="backup-bar">
      <button class="btn btn-outline btn-sm" onclick="exportBackup()">📥 Export Backup</button>
      <label class="btn btn-outline btn-sm" style="cursor:pointer;">
        📤 Import Backup
        <input type="file" accept=".json" style="display:none" onchange="importBackup(this.files[0])" />
      </label>
    </div>

  </div>

  <!-- Bottom Nav Bar -->
  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="assets/app.js"></script>

  <script>
    function renderHomeKPIs() {
      const newArrivals = getNewArrivalsCount();
      const todayReminders = getTodayReminders().length;
      const missedReminders = getMissedReminders().length;
      const allCompanies = getAllCompanies().length;

      const elNew = document.getElementById('count-new-arrival');
      const elToday = document.getElementById('count-today-reminder');
      const elMissed = document.getElementById('count-missed-reminder');
      const elAll = document.getElementById('count-all-data');

      if (elNew) elNew.textContent = newArrivals;
      if (elToday) elToday.textContent = todayReminders;
      if (elMissed) elMissed.textContent = missedReminders;
      if (elAll) elAll.textContent = allCompanies;
    }

    document.addEventListener('DOMContentLoaded', () => {
      initLiveClock('top-live-clock');
      renderBottomNav('home');
      onDataChange(renderHomeKPIs);
      setTimeout(renderHomeKPIs, 400);
    });
  </script>
</body>
</html>
